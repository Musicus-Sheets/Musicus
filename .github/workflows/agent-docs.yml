name: Agent docs
on:
  pull_request:
  push:
    branches: ["**"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Needs read access to the docs submodules (requirements IDs, decision labels).
          submodules: recursive
      - name: Check docs/agents
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            python3 docs/agents/check.py --since "$BASE"
          else
            python3 docs/agents/check.py
          fi
