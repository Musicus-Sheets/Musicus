name: User guide site
# Publishes the user guide of every release to GitHub Pages (a-guide-site):
#   /                 list of all versions
#   /<tag>/           guide of each release (HTML + PDF), /latest/ = newest release
#   /test-<ref>/      manual runs only: test build of the chosen ref
# Two ways it runs:
#   - last step of the release pipeline (.github/workflows/release.yml, workflow_call): deploys
#     the site that the pipeline built and checked in its stage 1 (input `site-artifact`, an
#     artifact of the calling run), including the new release. It no longer runs on
#     `release: published` (that would deploy twice; a release published by hand does not
#     change the site until the next pipeline run or a manual run).
#   - manual run (workflow_dispatch, input `ref`): rebuilds the whole site from the published
#     release tags (scripts/build-guide-site.sh) plus a test build of `ref`.
# Every deploy replaces the deployed site, so a release run drops earlier test builds.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions"; the environment
# "github-pages" must allow deployments from main and from the branches manual runs use
# (see docs/agents/workflows.md, docs/github-setup.md).
on:
  workflow_call:
    inputs:
      site-artifact:
        description: Name of an artifact of the calling run that holds the built site
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of Musicus to publish as a test build (empty = the branch this run uses)
        required: false
        default: ""
permissions:
  contents: read
env:
  TYPST_VERSION: v0.15.1
  TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Called by the release pipeline: its tested site, nothing is built here.
      - uses: actions/download-artifact@v4
        if: inputs.site-artifact
        with:
          name: ${{ inputs.site-artifact }}
          path: _site
      - uses: actions/checkout@v4
        if: ${{ !inputs.site-artifact }}
        with:
          fetch-depth: 0 # all tags and branches; the script reads each tag's submodule pointer
          submodules: false # the script fetches the user-guide commits itself (HTTPS)
      - name: Install Typst
        if: ${{ !inputs.site-artifact }}
        run: |
          curl -sSfL -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "$TYPST_SHA256  typst.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/typst"
          tar -xJf typst.tar.xz -C "$RUNNER_TEMP/typst" --strip-components=1
          rm typst.tar.xz
          echo "$RUNNER_TEMP/typst" >>"$GITHUB_PATH"
      - name: List releases
        if: ${{ !inputs.site-artifact }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName --jq '.[].tagName' >"$RUNNER_TEMP/releases.txt"
          cat "$RUNNER_TEMP/releases.txt"
      - name: Build site
        if: ${{ !inputs.site-artifact }}
        env:
          PREVIEW: ${{ inputs.ref || github.ref_name }}
        run: ./scripts/build-guide-site.sh --out _site --releases "$RUNNER_TEMP/releases.txt" ${PREVIEW:+--preview "$PREVIEW"}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One deploy at a time (manual runs and release pipelines).
    concurrency:
      group: user-guide-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
