name: Release
# The release pipeline (a-release-pipeline, R-OPS-049; RELEASING.md § 4; chapter "Release pipeline"
# of docs/technical/chapters/14-updates.typ). It publishes nothing unless every build and check
# succeeded.
#
# When it runs:
#   dry run   a push to a branch release/X.Y.Z: stage 1, nothing is published. Its checks show on the
#             release pull request (they belong to its head commit); it needs that pull request open
#             (the release notes are in its description), else it fails: open it, then "Re-run all
#             jobs". Not on pull_request: that would start on every pull request (all jobs skipped).
#   real run  the push to main that merges such a pull request (merge commit, squash or rebase;
#             found through the API): stage 1, then stage 2. Every other push to main ends after
#             the job `plan` (nothing else runs).
#   again     Actions -> Release -> Run workflow, branch main, input `version` = the merged release:
#             builds the head of main (or input `ref`, a commit on main that contains the merge of
#             release/X.Y.Z, e.g. after a fix was merged) and publishes what is still missing;
#             `publish` off = a dry run of that commit. After a failed stage 2 step, "Re-run failed
#             jobs" of the same run is enough (it uses the run's artifacts).
#
# Stage 1 (results are artifacts that expire after 7 days):
#   plan -> checks, lint, web, docs; web -> program (5 platforms) -> image, assets;
#   all -> stage-1 (the gate). macos-x86_64 runs but does not block (R-OPS-042).
# Stage 2 (real runs only, after the gate; least reversible last; every step skips what exists):
#   images -> tag -> github-release -> site (.github/workflows/user-guide-pages.yml).
#
# Container registry (repository variables and secrets, all optional):
#   vars.IMAGE_REGISTRY (default ghcr.io), vars.IMAGE_NAME (default: this repository, lower case),
#   secrets.IMAGE_REGISTRY_USERNAME / IMAGE_REGISTRY_PASSWORD (default for ghcr.io: the workflow's
#   GITHUB_TOKEN with packages: write); a second registry: vars.DOCKERHUB_IMAGE (e.g. musicus/musicus)
#   with secrets.DOCKERHUB_USERNAME / DOCKERHUB_TOKEN. Tags: X.Y.Z and X.Y (R-OPS-028).
# One-time setup (Pages environment, package visibility, Release Builder app, environment `release`,
# tag ruleset): docs/github-setup.md.
on:
  push:
    branches: [main, "release/**"]
  workflow_dispatch:
    inputs:
      version:
        description: Version X.Y.Z of the merged release/X.Y.Z pull request
        required: true
        type: string
      ref:
        description: Commit on main to release (empty = the head of main)
        required: false
        default: ""
        type: string
      publish:
        description: Publish (stage 2); off = only build and check
        required: false
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  # Dry runs per release branch (a newer push cancels the older run); real runs never cancelled.
  group: release-${{ github.event_name }}-${{ startsWith(github.ref, 'refs/heads/release/') && github.ref_name || inputs.version || github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/release/') }}
defaults:
  run:
    shell: bash
env:
  # Same toolchain as rust.yml and the Docker build; same dx as the Dockerfile; same Typst as
  # user-guide-pages.yml.
  RUST_TOOLCHAIN: "1.97"
  DX_VERSION: 0.7.10
  TYPST_VERSION: v0.15.1
  TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c
  CARGO_TERM_COLOR: always
  RETENTION_DAYS: 7
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      line: ${{ steps.plan.outputs.line }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      base: ${{ steps.plan.outputs.base }}
      branch: ${{ steps.plan.outputs.branch }}
      pr: ${{ steps.plan.outputs.pr }}
      images: ${{ steps.plan.outputs.images }}
      guide_url: ${{ steps.plan.outputs.guide_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: What to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          DELETED: ${{ github.event.deleted }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          release_re='^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          out() { echo "$1=$2" >>"$GITHUB_OUTPUT"; }
          fail() { echo "::error::$1"; exit 1; }
          nothing() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; out run false; exit 0; }
          # The main commit a merged pull request starts from: the first parent of its merge
          # (merge commit, squash), skipping its own rebased commits (rebase merge).
          base_of() {
            local b
            b="$(git rev-parse "$1^1")"
            for _ in $(seq 1 300); do
              if ! gh api "repos/$REPO/commits/$b/pulls" --jq '.[].number' | grep -qx "$2"; then
                echo "$b"
                return 0
              fi
              b="$(git rev-parse "$b^1")"
            done
            fail "cannot find the start of pull request #$2 on main"
          }

          # dry = push to release/X.Y.Z; merge = push to main; again = workflow_dispatch.
          case "$EVENT:$GITHUB_REF" in
            push:refs/heads/release/*) mode=dry ;;
            push:refs/heads/main) mode=merge ;;
            workflow_dispatch:*) mode=again ;;
            *) fail "unexpected event $EVENT ($GITHUB_REF)" ;;
          esac
          [[ "$DELETED" != true ]] || nothing "A branch was deleted: nothing to do."

          case "$mode" in
            dry)
              # Dry run: a push to release/X.Y.Z; the open pull request from it into main.
              branch="${GITHUB_REF#refs/heads/}"
              [[ "$branch" =~ $release_re ]] ||
                fail "release branches are named release/X.Y.Z (for example release/1.3.0), not $branch"
              pr="$(gh api -X GET "repos/$REPO/pulls" -f state=open -f base=main \
                -f "head=${REPO%%/*}:$branch" --jq 'first | .number // empty')"
              [[ -n "$pr" ]] ||
                fail "no open pull request from $branch into main: open it (with the section '## Release notes'), then Re-run all jobs"
              sha="$GITHUB_SHA"
              base="$(git merge-base origin/main "$sha")" || fail "$branch has no common commit with main"
              publish=false
              ;;
            merge)
              pr_json="$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" --jq "[.[] | select(.merged_at != null
                and .base.ref == \"main\" and .merge_commit_sha == \"$GITHUB_SHA\")] | first // empty")"
              [[ -n "$pr_json" ]] || nothing "No pull request was merged by this push: nothing to release."
              branch="$(jq -r .head.ref <<<"$pr_json")"
              pr="$(jq -r .number <<<"$pr_json")"
              [[ "$branch" =~ $release_re ]] || nothing "Pull request #$pr ($branch) is not a release: nothing to release."
              [[ "$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")" == "$REPO" ]] ||
                fail "release pull request #$pr comes from another repository"
              sha="$GITHUB_SHA"
              base="$(base_of "$sha" "$pr")"
              publish=true
              ;;
            again)
              [[ "$GITHUB_REF" == refs/heads/main ]] || fail "run the release workflow from the branch main"
              branch="release/$INPUT_VERSION"
              [[ "$branch" =~ $release_re ]] || fail "input version: X.Y.Z expected, not $INPUT_VERSION"
              pr_json="$(gh api -X GET "repos/$REPO/pulls" -f state=closed -f base=main \
                -f "head=${REPO%%/*}:$branch" -f per_page=100 \
                --jq '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last // empty')"
              [[ -n "$pr_json" ]] || fail "no merged pull request from $branch into main"
              pr="$(jq -r .number <<<"$pr_json")"
              merge="$(jq -r .merge_commit_sha <<<"$pr_json")"
              sha="$(git rev-parse --verify "${INPUT_REF:-$GITHUB_SHA}^{commit}")" || fail "unknown commit $INPUT_REF"
              git merge-base --is-ancestor "$sha" origin/main || fail "$sha is not on main"
              git merge-base --is-ancestor "$merge" "$sha" ||
                fail "$sha does not contain the merge of $branch (pull request #$pr, $merge)"
              base="$(base_of "$merge" "$pr")"
              publish="$INPUT_PUBLISH"
              ;;
          esac

          version="${branch#release/}"
          tag="v$version"
          # A tag of this version on another commit: the version is released already.
          if tagged="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2>/dev/null)"; then
            read -r type obj <<<"$tagged"
            [[ "$type" != tag ]] || obj="$(gh api "repos/$REPO/git/tags/$obj" --jq .object.sha)"
            [[ "$obj" == "$sha" ]] ||
              fail "the tag $tag exists already, on $obj: $version is released; raise the version"
            echo "::notice::The tag $tag exists on this commit already (a run again)."
          fi

          lower() { tr '[:upper:]' '[:lower:]'; }
          images="${IMAGE_REGISTRY:-ghcr.io}/$(lower <<<"${IMAGE_NAME:-$REPO}")"
          [[ -z "$DOCKERHUB_IMAGE" ]] || images+=" docker.io/$(lower <<<"$DOCKERHUB_IMAGE")"
          owner="$(lower <<<"${REPO%%/*}")"
          {
            echo "run=true"
            echo "publish=$publish"
            echo "version=$version"
            echo "line=${version%.*}"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "base=$base"
            echo "branch=$branch"
            echo "pr=$pr"
            echo "images=$images"
            echo "guide_url=https://$owner.github.io/${REPO#*/}/latest/"
          } >>"$GITHUB_OUTPUT"
          {
            if [[ "$publish" == true ]]; then
              echo "## Real run: Musicus $version"
            else
              echo "## Dry run: Musicus $version (nothing is published)"
            fi
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Pull request | #$pr ($branch) |"
            echo "| Commit | $sha |"
            echo "| Base (main before the release) | $base |"
            echo "| Tag | $tag |"
            echo "| Images | $images (tags $version, ${version%.*}) |"
          } >>"$GITHUB_STEP_SUMMARY"

  # ---- Stage 1: build and check everything; results are expiring artifacts only ------------

  checks:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ needs.plan.outputs.base }}
      BRANCH: ${{ needs.plan.outputs.branch }}
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      # R-OPS-040, R-OPS-018 and the version (a-version-source).
      - name: Release check (version, database updates)
        run: python3 scripts/release-check.py --branch "$BRANCH" "$BASE" HEAD
      - name: Docs submodules point to merged docs
        if: success() || failure()
        run: ./scripts/check-submodules.sh
      - name: Agent docs
        if: success() || failure()
        run: python3 docs/agents/check.py --since "$BASE"
      - uses: astral-sh/setup-uv@v6
        if: success() || failure()
      - name: Requirements
        if: success() || failure()
        run: uv run docs/requirements/tools/validate.py
      - name: No literal UI text
        if: success() || failure()
        run: python3 scripts/check-ui-literals.py
      - uses: dtolnay/rust-toolchain@master
        if: success() || failure()
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        if: success() || failure()
      # The merged update must create the structure the previews created (R-OPS-040).
      - name: schema.sql unchanged by the merge
        if: success() || failure()
        run: ./scripts/db-schema.sh --check

  # The jobs of rust.yml that are the same on every platform (the tests run in `program`).
  lint:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets
      - run: cargo clippy --locked --all-targets -p musicus-server --features embed-web
        env:
          MUSICUS_WEB_DIST: crates/musicus-server/tests/fixtures/web
      - run: cargo clippy --locked -p musicus-web --target wasm32-unknown-unknown
      - run: cargo test --locked -p musicus-web

  # The release web client: one build for every platform (WebAssembly is the same everywhere).
  web:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Dioxus CLI (cached)
        id: dx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/musicus-dx
          key: dx-${{ env.DX_VERSION }}-${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}
      - name: Install the Dioxus CLI
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: cargo install --locked dioxus-cli --version "$DX_VERSION" --root ~/.cache/musicus-dx
      - run: echo "$HOME/.cache/musicus-dx/bin" >>"$GITHUB_PATH"
      - run: ./scripts/fetch-pdfjs.sh
      # The folder is emptied first, so no file of an earlier build gets into the program.
      - name: Build the release web client
        run: |
          rm -rf target/dx/musicus-web/release
          dx bundle --platform web --package musicus-web --release
          test -f target/dx/musicus-web/release/web/public/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: web-client
          path: target/dx/musicus-web/release/web/public
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
          overwrite: true

  # Per platform (R-OPS-032): tests, release build with the web client built in, smoke test, archive.
  program:
    needs: [plan, web]
    if: needs.plan.outputs.run == 'true'
    name: program (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # macOS on Intel is a should (R-OPS-042): its failure does not stop the release; the release
    # notes then say it is not available (job `assets`).
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported runner image, so the program needs no newer glibc.
          - { platform: linux-x86_64, runner: ubuntu-22.04, blocking: true, exe: "" }
          - { platform: linux-arm64, runner: ubuntu-22.04-arm, blocking: true, exe: "" }
          - { platform: windows-x86_64, runner: windows-2022, blocking: true, exe: .exe }
          - { platform: macos-arm64, runner: macos-14, blocking: true, exe: "" }
          - { platform: macos-x86_64, runner: macos-15-intel, blocking: false, exe: "" }
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests start `python3`; on Windows only `python` is installed.
      - name: python3 on Windows
        if: runner.os == 'Windows'
        run: |
          dir="$(dirname "$(command -v python)")"
          [[ -e "$dir/python3.exe" ]] || cp "$dir/python.exe" "$dir/python3.exe"
          python3 --version
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - uses: actions/download-artifact@v4
        with:
          name: web-client
          path: target/dx/musicus-web/release/web/public
      - name: Tests
        run: cargo test --locked
      # A release build refuses to start with preview updates (R-OPS-024) and does not build
      # without the web client (R-OPS-030).
      - name: Release build
        env:
          MUSICUS_RELEASE_BUILD: "1"
        run: cargo build --release --locked -p musicus-server --features embed-web
      - name: Smoke test
        run: python3 scripts/smoke-program.py --program "target/release/musicus-server$EXE" --version "$VERSION"
      - name: Archive
        env:
          GUIDE_URL: ${{ needs.plan.outputs.guide_url }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python3 scripts/package-program.py archive --program "target/release/musicus-server$EXE" \
            --version "$VERSION" --platform "${{ matrix.platform }}" --out dist --guide-url "$GUIDE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: program-${{ matrix.platform }}
          path: dist/*
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
          overwrite: true

  # Multi-arch image (R-OPS-028) around the Linux programs built above; built, tested, not pushed.
  image:
    needs: [plan, program]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: program-linux-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Programs for the image
        run: |
          for pair in amd64:linux-x86_64 arm64:linux-arm64; do
            arch="${pair%%:*}" platform="${pair#*:}"
            mkdir -p "$RUNNER_TEMP/program/$arch"
            tar -xzf "$RUNNER_TEMP/dist/musicus-$VERSION-$platform.tar.gz" -C "$RUNNER_TEMP/program/$arch" \
              --strip-components=1 "musicus-$VERSION-$platform/musicus-server"
          done
          ls -l "$RUNNER_TEMP"/program/*
      # Only for running the arm64 image in its smoke test; building copies files and runs nothing.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build (linux/amd64 + linux/arm64, OCI archive)
        run: |
          docker buildx build --target release --build-context "program=$RUNNER_TEMP/program" \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.title=Musicus" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$SHA" \
            --label "org.opencontainers.image.source=https://github.com/$REPO" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --output "type=oci,dest=$RUNNER_TEMP/musicus-image.tar" .
      - name: Smoke test of both images
        run: |
          for arch in amd64 arm64; do
            docker buildx build --target release --build-context "program=$RUNNER_TEMP/program" \
              --platform "linux/$arch" --load -t "musicus-release-test:$arch" .
            docker run -d --name "musicus-$arch" --platform "linux/$arch" -p 127.0.0.1::8080 "musicus-release-test:$arch"
            port="$(docker port "musicus-$arch" 8080/tcp | head -n 1 | sed 's/.*://')"
            for _ in $(seq 1 120); do
              curl -fsS "http://127.0.0.1:$port/api/health" >/dev/null 2>&1 && break
              sleep 1
            done
            curl -fsS "http://127.0.0.1:$port/api/version" | tee "$RUNNER_TEMP/version.json"
            echo
            python3 -c 'import json, sys; v = json.load(open(sys.argv[1]))["version"]; sys.exit(v != sys.argv[2])' \
              "$RUNNER_TEMP/version.json" "$VERSION"
            curl -fsS "http://127.0.0.1:$port/" | grep -qi '<html'
            docker logs "musicus-$arch" 2>&1 | tee "$RUNNER_TEMP/log-$arch.txt" | grep -q 'web client: built into the program'
            docker stop -t 20 "musicus-$arch" >/dev/null
            code="$(docker inspect -f '{{.State.ExitCode}}' "musicus-$arch")"
            [[ "$code" == 0 ]] || { echo "::error::The $arch image exited with $code"; exit 1; }
            echo "$arch image: ok"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: image-oci
          path: ${{ runner.temp }}/musicus-image.tar
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
          overwrite: true

  # User guide and technical documentation (R-OPS-035) and the guide site including this release.
  docs:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0 # the release tags, for the guide site
          submodules: recursive
          persist-credentials: false # nothing of this job can push (the local tag below stays here)
      - name: Install Typst and pdftotext
        run: |
          curl -sSfL -o typst.tar.xz \
            "https://github.com/typst/typst/releases/download/$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "$TYPST_SHA256  typst.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/typst"
          tar -xJf typst.tar.xz -C "$RUNNER_TEMP/typst" --strip-components=1
          rm typst.tar.xz
          echo "$RUNNER_TEMP/typst" >>"$GITHUB_PATH"
          command -v pdftotext || { sudo apt-get update -q && sudo apt-get install -y -q poppler-utils; }
      # Without an argument both read the workspace version (a-version-source).
      - name: Build the user guide and the technical documentation
        run: |
          docs/user-guide/build.sh
          docs/technical/build.sh
      - name: Title pages name the release (R-OPS-035)
        run: |
          python3 scripts/release-check.py --title-pages "$VERSION" \
            docs/user-guide/out/musicus-user-guide.html docs/user-guide/out/musicus-user-guide.pdf \
            docs/technical/out/musicus-technical.html docs/technical/out/musicus-technical.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            docs/user-guide/out
            docs/technical/out
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
          overwrite: true
      - name: Build the guide site with this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --exclude-drafts --exclude-pre-releases --limit 1000 \
            --json tagName --jq '.[].tagName' >"$RUNNER_TEMP/releases.txt"
          grep -qxF "$TAG" "$RUNNER_TEMP/releases.txt" || echo "$TAG" >>"$RUNNER_TEMP/releases.txt"
          # A local tag only (never pushed), so the site script finds the release's commit.
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag "$TAG" "$SHA"
          cat "$RUNNER_TEMP/releases.txt"
          ./scripts/build-guide-site.sh --out _site --releases "$RUNNER_TEMP/releases.txt"
          latest="$(python3 -c 'import json; print(json.load(open("_site/versions.json"))["latest"])')"
          [[ "$latest" == "$TAG" ]] || { echo "::error::The guide site lists $latest as latest, not $TAG"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: guide-site
          path: _site
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
          overwrite: true

  # SHA256SUMS and the release notes (from the pull request's section "Release notes").
  assets:
    needs: [plan, program]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      LINE: ${{ needs.plan.outputs.line }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: program-*
          path: files
          merge-multiple: true
      - name: Checksums and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.plan.outputs.pr }}
          IMAGES: ${{ needs.plan.outputs.images }}
        run: |
          args=()
          for platform in linux-x86_64 linux-arm64 windows-x86_64 macos-arm64 macos-x86_64; do
            if compgen -G "files/musicus-$VERSION-$platform.*" >/dev/null; then
              continue
            elif [[ "$platform" == macos-x86_64 ]]; then
              echo "::warning::No program for $platform (its job failed; R-OPS-042): the release notes say so."
              args+=(--missing "$platform")
            else
              echo "::error::No program for $platform"
              exit 1
            fi
          done
          for image in $IMAGES; do
            args+=(--image "$image:$VERSION" --image "$image:$LINE")
          done
          python3 scripts/package-program.py sums files
          # Read now (not from the event): edits of the description count, also in a re-run.
          gh api "repos/$REPO/pulls/$PR" --jq '.body // ""' >"$RUNNER_TEMP/body.md"
          mkdir -p notes
          python3 scripts/release-notes.py --version "$VERSION" --body "$RUNNER_TEMP/body.md" "${args[@]}" \
            >notes/release-notes.md
          cat notes/release-notes.md >>"$GITHUB_STEP_SUMMARY"
          ls -l files
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: files/*
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes/release-notes.md
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
          overwrite: true

  # The gate: stage 2 starts only if every stage 1 job succeeded.
  stage-1:
    needs: [plan, checks, lint, web, program, image, docs, assets]
    if: always() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every stage 1 job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [[ -n "$failed" ]]; then
            echo "::error::Stage 1 did not succeed, nothing is published: $(tr '\n' ' ' <<<"$failed")"
            exit 1
          fi
          echo "Stage 1 succeeded." | tee -a "$GITHUB_STEP_SUMMARY"

  # ---- Stage 2: publish, least reversible last; every step skips what already exists ----------

  images:
    needs: [plan, stage-1]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      LINE: ${{ needs.plan.outputs.line }}
      IMAGES: ${{ needs.plan.outputs.images }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-oci
          path: ${{ runner.temp }}
      - name: Push X.Y.Z and X.Y
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q skopeo; }
          archive="oci-archive:$RUNNER_TEMP/musicus-image.tar"
          for image in $IMAGES; do
            host="${image%%/*}"
            if [[ "$host" == docker.io ]]; then
              user="$DOCKERHUB_USERNAME" pass="$DOCKERHUB_TOKEN"
            elif [[ "$host" == ghcr.io && -z "$REGISTRY_USERNAME" ]]; then
              user="$GITHUB_ACTOR" pass="$GITHUB_TOKEN"
            else
              user="$REGISTRY_USERNAME" pass="$REGISTRY_PASSWORD"
            fi
            [[ -n "$user" && -n "$pass" ]] || { echo "::error::No credentials for $host (see the head of release.yml)"; exit 1; }
            skopeo login --username "$user" --password-stdin "$host" <<<"$pass"
            # X.Y.Z is never replaced: an earlier run pushed it already (a run again).
            if skopeo inspect --raw "docker://$image:$VERSION" >/dev/null 2>&1; then
              echo "::notice::$image:$VERSION exists already; not pushed again."
            else
              skopeo copy --all --preserve-digests "$archive" "docker://$image:$VERSION"
            fi
            # X.Y follows the newest release of its line (releases are always the newest, no back-ports).
            skopeo copy --all --preserve-digests "docker://$image:$VERSION" "docker://$image:$LINE"
            a="$(skopeo inspect --raw "docker://$image:$VERSION" | sha256sum)"
            b="$(skopeo inspect --raw "docker://$image:$LINE" | sha256sum)"
            [[ "$a" == "$b" ]] || { echo "::error::$image:$LINE differs from $image:$VERSION"; exit 1; }
            echo "- \`$image:$VERSION\`, \`$image:$LINE\`" >>"$GITHUB_STEP_SUMMARY"
          done

  tag:
    needs: [plan, images]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-publish
      cancel-in-progress: false
    environment: release
    permissions:
      contents: read
    steps:
      # The Release Builder app (docs/github-setup.md): only it passes the v* tag rulesets (GITHUB_TOKEN
      # cannot be put on a bypass list). Its key lives only in the environment `release` (main only).
      # One token for the main repository and the three docs repositories (R-OPS-036).
      - name: Create the app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }},Musicus-requirements,Musicus-docs,Musicus-user-guide
          permission-contents: write
      # Main repository first, then each docs repository on the commit the release's submodule
      # pointer names (on its main: check `pinned`). Same commit tagged already => kept; tag on
      # another commit => error. A run again creates only the missing tags.
      - name: Tag the release commit and the docs repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          # tag_repo <owner/repo> <commit>
          tag_repo() {
            local target="$1" sha="$2" tagged type obj
            if tagged="$(gh api "repos/$target/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null)"; then
              read -r type obj <<<"$tagged"
              [[ "$type" != tag ]] || obj="$(gh api "repos/$target/git/tags/$obj" --jq .object.sha)"
              if [[ "$obj" != "$sha" ]]; then
                echo "::error::$target: the tag $TAG exists on $obj, not on $sha"
                return 1
              fi
              echo "::notice::$target: $TAG exists on $sha already."
            else
              gh api "repos/$target/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$sha" --silent
              echo "- $target: created $TAG on $sha" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          }
          tag_repo "$REPO" "$SHA"
          # Submodule path => repository (the URLs in .gitmodules are not used: they are SSH URLs).
          for pair in docs/requirements=Musicus-requirements docs/technical=Musicus-docs \
                      docs/user-guide=Musicus-user-guide; do
            path="${pair%%=*}" target="$OWNER/${pair#*=}"
            pinned="$(gh api "repos/$REPO/contents/$path?ref=$SHA" --jq 'select(.type == "submodule") | .sha')"
            [[ "$pinned" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$path is no submodule at $SHA"; exit 1; }
            tag_repo "$target" "$pinned"
          done

  github-release:
    needs: [plan, tag]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: files
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      # Created as a draft with every file, published at the end: a release is never visible
      # with only some of its files. A draft of an earlier run gets this run's files and notes.
      - name: Create and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          case "$draft" in
            none)
              gh release create "$TAG" --verify-tag --draft --title "Musicus $VERSION" \
                --notes-file notes/release-notes.md files/*
              ;;
            true)
              gh release edit "$TAG" --title "Musicus $VERSION" --notes-file notes/release-notes.md
              gh release upload "$TAG" files/* --clobber
              ;;
            false)
              have="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
              for f in files/*; do
                grep -qxF "$(basename "$f")" <<<"$have" ||
                  { echo "::error::The published release $TAG lacks $(basename "$f"); add it by hand"; exit 1; }
              done
              echo "::notice::The release $TAG is published with all files already."
              exit 0
              ;;
          esac
          gh release edit "$TAG" --draft=false --latest
          echo "Published the release $TAG." | tee -a "$GITHUB_STEP_SUMMARY"

  # Last: the user guide site, the tested build of stage 1 (a-guide-site).
  site:
    needs: [plan, github-release]
    if: needs.plan.outputs.publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/user-guide-pages.yml
    with:
      site-artifact: guide-site
