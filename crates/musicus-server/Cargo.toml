[package]
name = "musicus-server"
description = "Musicus sheet music server: library, access control, file serving and private annotations."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Builds the web client into the program, so it is one file (R-OPS-030).
# Needs the built client: `dx bundle --platform web --package musicus-web --release`
# (or MUSICUS_WEB_DIST=<folder>, relative to the repository root).
embed-web = []

[dependencies]
argon2 = "0.6"
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
fs4 = "1.1"
futures-util = "0.3"
getrandom = "0.3"
hayro = "0.8"
hex = "0.4"
mime_guess = "2"
musicus-api.workspace = true
musicus-i18n.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "derive", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace", "set-header", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"

[dev-dependencies]
# Composes the English part names in the API tests (the server itself sends none).
musicus-i18n = { workspace = true, features = ["bundles"] }
http-body-util = "0.1"
tempfile = "3"
