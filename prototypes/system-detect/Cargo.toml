[package]
name = "system-detect"
version = "0.1.0"
edition = "2024"

[dependencies]
hayro = "0.8.0"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = 1

[[bin]]
name = "system-detect"
path = "src/main.rs"

[[bin]]
name = "nav-sim"
path = "src/bin/nav_sim.rs"
