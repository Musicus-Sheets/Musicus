# Musicus with SQLite: one container, all data in one volume.
#
#   cp .env.example .env              # adjust, then:
#   docker compose up -d --build      # http://localhost:8080
#   docker compose logs musicus       # shows the one-time admin setup link
#
# With HTTPS (needed for phones and tablets on the network; see README):
#   set MUSICUS_DOMAIN and MUSICUS_PUBLIC_URL in .env, then
#   docker compose --profile https up -d --build
#
# Backup while running (database first, then the immutable files):
#   docker compose exec musicus musicus-server backup --to /data/backup.sqlite
# Restore (server stopped; the replaced database is kept in /data/snapshots):
#   docker compose stop musicus
#   docker compose run --rm musicus restore --from /data/backup.sqlite
#   docker compose up -d

name: musicus

services:
  musicus:
    build: .
    image: musicus:latest
    restart: unless-stopped
    environment:
      MUSICUS_PUBLIC_URL: ${MUSICUS_PUBLIC_URL:-http://localhost:8080}
      MUSICUS_CLIENT_CACHE: ${MUSICUS_CLIENT_CACHE:-none}
      MUSICUS_RAM_CACHE_MB: ${MUSICUS_RAM_CACHE_MB:-128}
      MUSICUS_MAX_UPLOAD_MB: ${MUSICUS_MAX_UPLOAD_MB:-200}
      MUSICUS_SESSION_DAYS: ${MUSICUS_SESSION_DAYS:-60}
      MUSICUS_SHUTDOWN_GRACE_SECS: ${MUSICUS_SHUTDOWN_GRACE_SECS:-3}
      MUSICUS_INSECURE_COOKIES: ${MUSICUS_INSECURE_COOKIES:-false}
      MUSICUS_TRUST_PROXY: ${MUSICUS_TRUST_PROXY:-false}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      # MUSICUS_LOCAL_ONLY empty (default): published on every address,
      # IPv4 and IPv6 (both lines are then the same and count once).
      # MUSICUS_LOCAL_ONLY=true (any non-empty value): only 127.0.0.1 and
      # [::1], for the https profile or a proxy on this machine, so nobody
      # bypasses it; the proxy may connect to "localhost".
      # Other addresses: your own compose.override.yaml, see
      # compose.override.example.yaml and the user guide.
      - "${MUSICUS_LOCAL_ONLY:+127.0.0.1:}${MUSICUS_PORT:-8080}:8080"
      - "${MUSICUS_LOCAL_ONLY:+[::1]:}${MUSICUS_PORT:-8080}:8080"
    # Data in a folder of your own instead of this volume (running as your
    # user): compose.override.yaml, see compose.override.example.yaml.
    volumes:
      - musicus-data:/data
    # On SIGTERM the server announces the stop to open browsers, serves them
    # for MUSICUS_SHUTDOWN_GRACE_SECS, then lets running requests finish (at
    # most 5 s more): keep the sum below this.
    stop_grace_period: 15s

  # Optional TLS termination with automatic Let's Encrypt certificates.
  caddy:
    image: caddy:2.10-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      MUSICUS_DOMAIN: ${MUSICUS_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      musicus:
        condition: service_healthy

volumes:
  musicus-data:
  caddy-data:
  caddy-config:
